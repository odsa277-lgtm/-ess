<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onlayn Shaxmat</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f1ea; --card: #ffffff; --ink: #1d2433; --muted: #5d667a; --line: #d9d6ca;
  --accent: #2f6b4f; --accent-ink: #ffffff;
  --sq-light: #ecdcb8; --sq-dark: #a9754f;
  --sel: #f3d94a; --last: rgba(243, 217, 74, 0.55); --check: #e5484d; --dot: rgba(20, 30, 20, 0.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14181f; --card: #1c222c; --ink: #e8e6df; --muted: #9aa3b5; --line: #2e3643;
    --accent: #5fb58a; --accent-ink: #0f1a14;
    --sq-light: #d8c9a4; --sq-dark: #8a5d3d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 1.6rem; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.card h2 { margin: 0 0 6px; font-size: 1.1rem; }
.muted { color: var(--muted); font-size: 0.92rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, input { font: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 16px; border-radius: 8px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible, .sq:focus-visible { outline: 3px solid var(--sel); outline-offset: 1px; }
input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 9ch; text-transform: uppercase; letter-spacing: 0.15em; }
.lobby { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.lobby > * { min-width: 0; }
.code { font-size: 2rem; font-weight: 700; letter-spacing: 0.25em; font-variant-numeric: tabular-nums; }
.game { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.boardbox { flex: 1 1 340px; min-width: 0; max-width: 580px; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 4px; overflow: hidden; }
.sq { position: relative; border: 0; border-radius: 0; padding: 0; background: var(--sq-light); display: flex; align-items: center; justify-content: center; font-size: clamp(26px, 8.4vw, 58px); line-height: 1; }
.sq.dark { background: var(--sq-dark); }
.sq.last { box-shadow: inset 0 0 0 100px var(--last); }
.sq.sel { box-shadow: inset 0 0 0 100px var(--sel); }
.sq.chk { box-shadow: inset 0 0 0 100px var(--check); }
.sq.hint::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--dot); }
.sq.hint.cap::after { width: 86%; height: 86%; background: none; border: 4px solid var(--dot); }
.pc { pointer-events: none; z-index: 1; }
.pc.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 1px #000, 0 1px 3px rgba(0,0,0,.6); }
.pc.b { color: #15171c; text-shadow: 0 0 1px rgba(255,255,255,.5); }
.lbl { position: absolute; font-size: 10px; font-weight: 700; color: var(--ink); opacity: 0.7; pointer-events: none; }
.lbl.r { top: 2px; left: 3px; } .lbl.f { bottom: 1px; right: 3px; }
.side { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.status { font-weight: 600; font-size: 1.05rem; }
.moves { max-height: 240px; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; display: grid; grid-template-columns: 2.2em 1fr 1fr; gap: 2px 8px; font-size: 0.95rem; }
.moves .n { color: var(--muted); }
.who { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--accent); }
.promo { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 20; }
.promo[hidden] { display: none; }
.promo .box { background: var(--card); padding: 16px; border-radius: 12px; display: flex; gap: 8px; }
.promo button { font-size: 44px; line-height: 1; padding: 6px 12px; }
.err { color: var(--check); font-size: 0.92rem; min-height: 1.2em; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Onlayn Shaxmat</h1>

  <section id="lobby" class="lobby">
    <div class="card">
      <h2>Yangi o'yin ochish</h2>
      <p class="muted">Kod hosil bo'ladi. Uni do'stingizga yuboring. Siz oq donalar bilan boshlaysiz.</p>
      <div class="row"><button id="btnCreate" class="primary">O'yin yaratish</button></div>
    </div>
    <div class="card">
      <h2>O'yinga qo'shilish</h2>
      <p class="muted">Do'stingiz yuborgan kodni kiriting.</p>
      <div class="row">
        <input id="codeIn" maxlength="5" placeholder="KOD" autocomplete="off" aria-label="O'yin kodi">
        <button id="btnJoin" class="primary">Qo'shilish</button>
      </div>
      <div id="joinErr" class="err" role="status"></div>
    </div>
  </section>

  <section id="waiting" class="card" hidden>
    <h2>Raqib kutilmoqda</h2>
    <p class="muted">Quyidagi kodni do'stingizga yuboring va u "Qo'shilish" bo'limiga kiritsin.</p>
    <div class="code" id="roomCode">-----</div>
    <div class="row" style="margin-top:12px">
      <button id="btnCopy">Kodni nusxalash</button>
      <button id="btnCopyLink">Havolani nusxalash</button>
    </div>
    <p class="muted" id="copyNote"></p>
  </section>

  <section id="gameSec" class="game" hidden>
    <div class="boardbox">
      <div class="who"><span class="dot" id="oppDot"></span><span id="oppLabel">Raqib</span></div>
      <div class="board" id="board" role="grid" aria-label="Shaxmat taxtasi" style="margin-block:8px"></div>
      <div class="who"><span class="dot on"></span><span id="meLabel">Siz</span></div>
    </div>
    <div class="side">
      <div class="card">
        <div class="status" id="status" role="status" aria-live="polite">...</div>
        <div class="muted" id="roomInfo"></div>
      </div>
      <div class="card">
        <h2>Yurishlar</h2>
        <ol class="moves" id="moves"></ol>
      </div>
      <div class="row">
        <button id="btnResign">Taslim bo'lish</button>
        <button id="btnNew" class="primary" hidden>Yangi o'yin</button>
        <button id="btnLeave">Chiqish</button>
      </div>
    </div>
  </section>
</div>

<div class="promo" id="promo" hidden><div class="box" id="promoBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function () {
  var PREFIX = 'shaxmat-uz-';
  var ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟︎' };
  var game = new Chess();
  var peer = null, conn = null, roomCode = '', isHost = false;
  var myColor = null, selected = null, lastMove = null, over = false, resigned = null;

  function $(id) { return document.getElementById(id); }
  var boardEl = $('board');

  function show(which) {
    $('lobby').hidden = which !== 'lobby';
    $('waiting').hidden = which !== 'waiting';
    $('gameSec').hidden = which !== 'game';
  }
  function genCode() {
    var s = '';
    for (var i = 0; i < 5; i++) s += ALPHA[Math.floor(Math.random() * ALPHA.length)];
    return s;
  }
  function teardown() {
    try { if (conn) conn.close(); } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    conn = null; peer = null;
  }

  /* ---------- Ulanish ---------- */
  function createRoom() {
    teardown();
    isHost = true;
    roomCode = genCode();
    $('roomCode').textContent = roomCode;
    $('copyNote').textContent = '';
    show('waiting');
    peer = new Peer(PREFIX + roomCode);
    peer.on('error', function (err) {
      if (err.type === 'unavailable-id') { createRoom(); return; }
      $('copyNote').textContent = 'Ulanishda xatolik: ' + err.type + '. Qayta urinib ko\'ring.';
    });
    peer.on('connection', function (c) {
      if (conn && conn.open) { c.on('open', function () { c.close(); }); return; }
      conn = c;
      bindConn();
      c.on('open', function () {
        myColor = 'w';
        c.send({ type: 'start', hostColor: 'w' });
        startGame();
      });
    });
  }

  function joinRoom(code) {
    code = (code || '').toUpperCase().trim();
    if (code.length !== 5) { $('joinErr').textContent = 'Kod 5 ta belgidan iborat bo\'lishi kerak.'; return; }
    $('joinErr').textContent = 'Ulanmoqda...';
    teardown();
    isHost = false;
    roomCode = code;
    peer = new Peer();
    var timer = setTimeout(function () {
      if (!conn || !conn.open) {
        $('joinErr').textContent = 'Ulanib bo\'lmadi. Kodni tekshiring yoki do\'stingiz o\'yinni ochganini bilib oling.';
        teardown();
      }
    }, 12000);
    peer.on('error', function (err) {
      clearTimeout(timer);
      $('joinErr').textContent = err.type === 'peer-unavailable'
        ? 'Bunday o\'yin topilmadi. Kodni tekshiring.'
        : 'Ulanishda xatolik: ' + err.type;
    });
    peer.on('open', function () {
      conn = peer.connect(PREFIX + code, { reliable: true });
      bindConn();
      conn.on('open', function () { clearTimeout(timer); $('joinErr').textContent = ''; });
    });
  }

  function bindConn() {
    conn.on('data', onData);
    conn.on('close', function () {
      $('oppDot').classList.remove('on');
      if (!over) setStatus('Raqib uzilib qoldi.');
    });
    conn.on('open', function () { $('oppDot').classList.add('on'); });
  }

  function send(msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) {} }

  function onData(m) {
    if (!m || typeof m !== 'object') return;
    if (m.type === 'start') {
      myColor = m.hostColor === 'w' ? 'b' : 'w';
      startGame();
    } else if (m.type === 'move') {
      if (over || game.turn() === myColor) return;
      var mv = game.move({ from: m.from, to: m.to, promotion: m.promotion });
      if (mv) { lastMove = { from: mv.from, to: mv.to }; selected = null; render(); }
    } else if (m.type === 'resign') {
      resigned = myColor; over = true; render();
    } else if (m.type === 'new') {
      myColor = m.yourColor;
      resetBoard();
    }
  }

  /* ---------- O'yin ---------- */
  function resetBoard() {
    game.reset(); selected = null; lastMove = null; over = false; resigned = null;
    render();
  }
  function startGame() {
    resetBoard();
    $('oppDot').classList.add('on');
    $('roomInfo').textContent = 'Kod: ' + roomCode;
    show('game');
    render();
  }

  function findKing(color) {
    var b = game.board();
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var p = b[r][c];
      if (p && p.type === 'k' && p.color === color) return 'abcdefgh'[c] + (8 - r);
    }
    return null;
  }

  function setStatus(t) { $('status').textContent = t; }

  function updateStatus() {
    var color = { w: 'Oq', b: 'Qora' };
    var myName = myColor === 'w' ? 'oq' : 'qora';
    $('meLabel').textContent = 'Siz (' + myName + ')';
    $('oppLabel').textContent = 'Raqib (' + (myColor === 'w' ? 'qora' : 'oq') + ')';
    var done = false, text;
    if (resigned) {
      done = true;
      text = resigned === myColor ? 'Siz taslim bo\'ldingiz. Raqib g\'alaba qozondi.' : 'Raqib taslim bo\'ldi. Siz g\'alaba qozondingiz!';
    } else if (game.in_checkmate()) {
      done = true;
      text = 'Mat! ' + (game.turn() === myColor ? 'Siz yutqazdingiz.' : 'Siz g\'alaba qozondingiz!');
    } else if (game.in_stalemate()) { done = true; text = 'Pat. Durang.'; }
    else if (game.insufficient_material()) { done = true; text = 'Material yetarli emas. Durang.'; }
    else if (game.in_threefold_repetition()) { done = true; text = 'Uch marta takrorlandi. Durang.'; }
    else if (game.in_draw()) { done = true; text = 'Durang.'; }
    else {
      var mine = game.turn() === myColor;
      text = (mine ? 'Sizning yurishingiz' : 'Raqib yurishi kutilmoqda') + ' (' + color[game.turn()] + ')';
      if (game.in_check()) text += ' · Shoh!';
    }
    over = done;
    setStatus(text);
    $('btnResign').hidden = done;
    $('btnNew').hidden = !(done && isHost);
    if (done && !isHost) setStatus(text + ' Yangi o\'yinni mezbon boshlaydi.');
  }

  function renderMoves() {
    var h = game.history(), ol = $('moves');
    ol.innerHTML = '';
    for (var i = 0; i < h.length; i += 2) {
      var n = document.createElement('li'); n.className = 'n'; n.textContent = (i / 2 + 1) + '.';
      var a = document.createElement('li'); a.textContent = h[i];
      var b = document.createElement('li'); b.textContent = h[i + 1] || '';
      ol.appendChild(n); ol.appendChild(a); ol.appendChild(b);
    }
    ol.scrollTop = ol.scrollHeight;
  }

  function render() {
    if (!myColor) return;
    var flip = myColor === 'b';
    var targets = {};
    if (selected) game.moves({ square: selected, verbose: true }).forEach(function (m) { targets[m.to] = m; });
    var checkSq = game.in_check() ? findKing(game.turn()) : null;
    boardEl.innerHTML = '';
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var rr = flip ? 7 - r : r, cc = flip ? 7 - c : c;
      var sq = 'abcdefgh'[cc] + (8 - rr);
      var p = game.get(sq);
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'sq' + ((rr + cc) % 2 === 1 ? ' dark' : '');
      el.dataset.sq = sq;
      el.setAttribute('aria-label', sq + (p ? ' ' + (p.color === 'w' ? 'oq' : 'qora') + ' ' + p.type : ''));
      if (lastMove && (lastMove.from === sq || lastMove.to === sq)) el.classList.add('last');
      if (selected === sq) el.classList.add('sel');
      if (checkSq === sq) el.classList.add('chk');
      if (targets[sq]) { el.classList.add('hint'); if (p) el.classList.add('cap'); }
      if (p) {
        var s = document.createElement('span');
        s.className = 'pc ' + p.color; s.textContent = GLYPH[p.type];
        el.appendChild(s);
      }
      if (c === 0) { var l1 = document.createElement('span'); l1.className = 'lbl r'; l1.textContent = String(8 - rr); el.appendChild(l1); }
      if (r === 7) { var l2 = document.createElement('span'); l2.className = 'lbl f'; l2.textContent = 'abcdefgh'[cc]; el.appendChild(l2); }
      boardEl.appendChild(el);
    }
    renderMoves();
    updateStatus();
  }

  function doMove(from, to, promo) {
    var mv = game.move({ from: from, to: to, promotion: promo });
    if (!mv) { selected = null; render(); return; }
    lastMove = { from: mv.from, to: mv.to };
    selected = null;
    send({ type: 'move', from: from, to: to, promotion: promo });
    render();
  }

  function askPromotion(from, to) {
    var box = $('promoBox'); box.innerHTML = '';
    ['q', 'r', 'b', 'n'].forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = GLYPH[t];
      b.style.color = myColor === 'w' ? '#fff' : '#15171c';
      b.style.textShadow = myColor === 'w' ? '0 0 2px #000, 0 0 2px #000' : 'none';
      b.style.background = '#b9a37a';
      b.onclick = function () { $('promo').hidden = true; doMove(from, to, t); };
      box.appendChild(b);
    });
    $('promo').hidden = false;
  }

  boardEl.addEventListener('click', function (e) {
    var el = e.target.closest('.sq');
    if (!el || over || !conn || !conn.open) return;
    if (game.turn() !== myColor) return;
    var sq = el.dataset.sq, p = game.get(sq);
    if (selected) {
      var cand = game.moves({ square: selected, verbose: true }).filter(function (m) { return m.to === sq; });
      if (cand.length) {
        if (cand[0].flags.indexOf('p') !== -1) askPromotion(selected, sq);
        else doMove(selected, sq);
        return;
      }
    }
    selected = (p && p.color === myColor && selected !== sq) ? sq : null;
    render();
  });

  /* ---------- Tugmalar ---------- */
  $('btnCreate').onclick = createRoom;
  $('btnJoin').onclick = function () { joinRoom($('codeIn').value); };
  $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') joinRoom($('codeIn').value); });
  $('btnResign').onclick = function () {
    if (over) return;
    send({ type: 'resign' });
    resigned = myColor; over = true; render();
  };
  $('btnNew').onclick = function () {
    var next = myColor === 'w' ? 'b' : 'w';
    send({ type: 'new', yourColor: myColor });
    myColor = next;
    resetBoard();
  };
  $('btnLeave').onclick = function () { teardown(); myColor = null; resetBoard(); show('lobby'); history.replaceState(null, '', location.pathname); };

  function copy(text, note) {
    function fallback() { $('copyNote').textContent = 'Nusxalab bo\'lmadi. Qo\'lda yozib oling: ' + text; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { $('copyNote').textContent = note; }, fallback);
    } else fallback();
  }
  $('btnCopy').onclick = function () { copy(roomCode, 'Kod nusxalandi.'); };
  $('btnCopyLink').onclick = function () { copy(location.href.split('#')[0] + '#' + roomCode, 'Havola nusxalandi.'); };

  window.addEventListener('beforeunload', teardown);

  var h = (location.hash || '').replace('#', '');
  if (h.length === 5) { $('codeIn').value = h.toUpperCase(); joinRoom(h); }
})();
</script>
</body>
</html>
